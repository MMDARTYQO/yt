name: הורדת סרטון

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'כתובת YouTube'
        required: true
        type: string
      format:
        description: 'פורמט הורדה (yt-dlp format string)'
        required: true
        default: 'bestvideo+bestaudio/best'
        type: string
      title:
        description: 'שם הסרטון (אופציונלי)'
        required: false
        type: string
      convert_to_gif:
        description: 'המר ל-GIF?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      gif_start:
        description: 'התחלת GIF (שניות, לדוגמה: 0)'
        required: false
        default: '0'
        type: string
      gif_duration:
        description: 'אורך GIF בשניות (לדוגמה: 10)'
        required: false
        default: '10'
        type: string
      gif_width:
        description: 'רוחב GIF בפיקסלים (לדוגמה: 480)'
        required: false
        default: '480'
        type: string
      gif_fps:
        description: 'FPS של GIF (לדוגמה: 10)'
        required: false
        default: '10'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: התקנת yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: התקנת Deno (JS runtime לyt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: התקנת ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg --fix-missing

      - name: הגדרת cookies
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/cookies.txt

      - name: הורדת הסרטון
        run: |
          mkdir -p downloads

          CUSTOM_TITLE="${{ github.event.inputs.title }}"

          if [ -n "$CUSTOM_TITLE" ]; then
            OUTPUT_TEMPLATE="downloads/${CUSTOM_TITLE}.%(ext)s"
          else
            OUTPUT_TEMPLATE="downloads/%(title)s.%(ext)s"
          fi

          yt-dlp \
            --format "${{ github.event.inputs.format }}" \
            --merge-output-format mp4 \
            --remux-video mp4 \
            --output "$OUTPUT_TEMPLATE" \
            --write-thumbnail \
            --convert-thumbnails jpg \
            --write-info-json \
            --no-playlist \
            --progress \
            --cookies /tmp/cookies.txt \
            "${{ github.event.inputs.url }}"

      - name: בדיקת קבצים שהורדו
        run: |
          echo "=== קבצים שהורדו ==="
          ls -lh downloads/
          echo "=== מידע על הסרטון ==="
          cat downloads/*.info.json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print('כותרת:', data.get('title', 'לא ידוע'))
          print('משך:', data.get('duration_string', 'לא ידוע'))
          print('צופים:', data.get('view_count', 'לא ידוע'))
          print('תאריך העלאה:', data.get('upload_date', 'לא ידוע'))
          " 2>/dev/null || true

      - name: וידוא שקיים קובץ MP4
        run: |
          MP4_COUNT=$(find downloads/ -maxdepth 1 -name "*.mp4" | wc -l)
          echo "נמצאו ${MP4_COUNT} קבצי MP4"
          if [ "$MP4_COUNT" -eq 0 ]; then
            echo "שגיאה: לא נוצר קובץ MP4. תוכן התיקייה:"
            ls -lah downloads/
            exit 1
          fi
          find downloads/ -maxdepth 1 -name "*.part" -delete
          find downloads/ -maxdepth 1 -name "*.ytdl" -delete
          find downloads/ -maxdepth 1 -name "*.f[0-9]*" -delete
          echo "קבצים סופיים:"
          ls -lh downloads/

      - name: המרה ל-GIF
        if: ${{ github.event.inputs.convert_to_gif == 'true' }}
        run: |
          MP4_FILE=$(find downloads/ -maxdepth 1 -name "*.mp4" | head -n 1)
          GIF_FILE="${MP4_FILE%.mp4}.gif"

          echo "ממיר: $MP4_FILE → $GIF_FILE"
          echo "הגדרות: התחלה=${{ github.event.inputs.gif_start }}s, אורך=${{ github.event.inputs.gif_duration }}s, רוחב=${{ github.event.inputs.gif_width }}px, FPS=${{ github.event.inputs.gif_fps }}"

          ffmpeg -ss "${{ github.event.inputs.gif_start }}" \
                 -t "${{ github.event.inputs.gif_duration }}" \
                 -i "$MP4_FILE" \
                 -vf "fps=${{ github.event.inputs.gif_fps }},scale=${{ github.event.inputs.gif_width }}:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
                 -loop 0 \
                 "$GIF_FILE"

          echo "=== GIF נוצר בהצלחה ==="
          ls -lh "$GIF_FILE"

          # אם רוצים רק GIF ולא MP4, מוחקים את ה-MP4
          # rm "$MP4_FILE"

      - name: העלאת הסרטון כ-Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-download
          path: downloads/
          retention-days: 1
          if-no-files-found: error
